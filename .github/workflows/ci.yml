name: WebOS CI & Verification

on:
  push:
    branches: [ master, phase-8-production-readiness ]
  pull_request:
    branches: [ master ]

jobs:
  fast-verification:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Verification
        run: npx tsc --noEmit

      - name: Unit Test Suite (Vitest)
        run: npm test -- --run

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Distribution Assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Production build assets verified."

  guest-verification:
    name: Live x86 Linux Guest Harness
    needs: fast-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 7 OS Experiments Live VM Harness
        run: node tests/boot/test-phase7-experiments.mjs
